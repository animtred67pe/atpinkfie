<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" type="text/css" href="index.css">
		<title>PinkFie - Flash Player Emulator</title>
		<script>
			// Apply local dark mode preference very early to avoid a flash of white
			(function() {
				try {
					if (localStorage.getItem('userPrefersDark') === 'true') {
						document.documentElement.classList.add('dark');
					}
				} catch (e) {
					console.log('error loading theme choice', e);
				}
			}());
		</script>
	</head>
	<body>
		<div class="app">
			<section>
				<h1>PinkFie</h1>
				<p>A Flash Player Emulator in JavaScript ES6</p>
				<p id="demo"></p>
				<!--<h3>New Content in 1.4</h3>
				<p>Upcoming AVM2</p>
				<p>Bug Fixed AVM1</p>-->
			</section>
			<ul>
				<li><a href="demo.html">Demo</a></li>
				<li><a href="app.html">app.html</a></li>
				<li><a href="desktop.html">Desktop</a></li>
			</ul>
			<br>
			<br>
			<a id="plydemo">Open .swf</a>
			<label>SWF URL:</label>
			<input type="text" style="width: 320px;" id="fileorurl" placeholder="https://..." name="pinkfie_swf_url">
			<a id="plyloadurl">Load</a>
			<br>
			<label>Enable WebGL Renderer:</label>
			<input type="checkbox" id="enwebgla">
			<div id="plyplaying" style=" display: none;">
				<a id="plycancel">Close Player</a>	
				<label id="ggtitle5"></label>
			</div>
			<div id="pinkfiedemo" style="display: none;">
				<div id="pinkswf"></div>
			</div>
			<ul id="pd_pkfcontrols" style="display: none;">
				<li><a id="pd_plyplaypause">Play/Pause</a></li>
				<li><a id="pd_plysetting">Settings</a></li>
				<li><a id="pd_plycontrol">Controls</a></li>
				<li id="pd_plyfullscreen" style="display: none;"><a>Full Screen</a></li>
				<li><a id="pd_plyreload">Reload SWF</a></li>
			</ul>
			<br>
			<div id="pinkfiedemo_info" style="display: none;"></div>
			<p>PinkFie source code available on <a href="https://github.com/animtred67pe/atpinkfie">GitHub.</a></p>
			<p><a style="color: #888; text-decoration-line: none;" href="https://animtred67pe.github.io/animtred67pe/">(c) 2026 EAXDMLPSXF</a></p>
		</div>
		<div class="theme-select">
			<a class="switch-theme">switch theme</a>
		</div>
		<script src="pinkfie.js"></script>
		<script src="common.js"></script>
		<script>
			(function() {
				function querySelector(selector) {
					var el = document.querySelector(selector);
					if (!el) {
						throw new Error('Selector returned nothing: ' + selector);
					}
					return el;
				}

				var initialTitle = document.title;

				function isMobileOrTablet() {
					if (window) {
						return ("orientation" in window);
					}
					return false;
				}

				var ggtitle5 = document.getElementById("ggtitle5");

				/* Players */
				var ppwidth = 640;
				var ppheight = 400;

				var pinkfiedemo = document.getElementById("pinkfiedemo");
				var pinkfiedemo_info = document.getElementById("pinkfiedemo_info");
				var pinkswf = document.getElementById("pinkswf");

				var pd_pkfcontrols = document.getElementById('pd_pkfcontrols');

                var fileorurl = document.getElementById('fileorurl');
                var plyloadurl = document.getElementById('plyloadurl');

				var plyplaying = document.getElementById('plyplaying');
				var plycancel = document.getElementById('plycancel');
				
				function showSwf() {

					var swfmetadata = player.getSwfMetadata();

					var resultswf = player.stage.swf;
					var dfgfd = "<h3>SWF Info</h3>";

					/*
						Uncompressed Length
						SWF Version
						FP Version
						ActionScript 3
						Total Frames
						Frame Rate
						SWF Width
						SWF Height
						SWF Background Color
					*/

					dfgfd += "signature: " + resultswf.header.compression;
					dfgfd += " version: " + swfmetadata.version;
					dfgfd += " uncompressed length: " + swfmetadata.uncompressedLength + "<br>";

					dfgfd += "resolution: " + swfmetadata.width;
					dfgfd += "x" + swfmetadata.height;
					dfgfd += " frame rate: " + (Math.round(swfmetadata.frameRate * 100) / 100);
					dfgfd += " total frames: " + swfmetadata.numFrames + "";

					//dfgfd += " SWF Background Color: " + resultswf.movieInfo.numFrames + "";

					pinkfiedemo_info.innerHTML = dfgfd;
					pinkfiedemo_info.style.display = "";
				}

				plyloadurl.onclick = function() {
					var resurl = fileorurl.value;
					if (resurl) {
						loadSwfUrl(resurl);
					}
				}

				var player = new PinkFie();

				player.setOptions(Common.playerOptions);

				if (!Common.autoplay) {
					player.setOptions({
						autoplayPolicy: "never"
					});
				}

				var isPhone = isMobileOrTablet();

				window.player = player;
				
				var oTitle = null;

				player.onstartload.subscribe(function() {
					if (oTitle) {
						document.title = oTitle + " - PinkFie";
						ggtitle5.textContent = oTitle;
					}
					plyplaying.style.display = "";
				});

				player.onload.subscribe(function() {
					showSwf();
				});

				player.oncleanup.subscribe(function() {
					document.title = initialTitle;
					plyplaying.style.display = "none";
					pinkfiedemo_info.innerHTML = '';
					pinkfiedemo_info.style.display = "none";
					ggtitle5.textContent = "";
				});

				plycancel.onclick = function() {
					player.cleanup();
					closedemo();
				}

				var plydemo = document.getElementById("plydemo");

				plydemo.onclick = function() {
					var sa = document.createElement('input');
					sa.type = 'file';
					sa.accept = '.swf';
					sa.addEventListener('change', function (e) {
						var file = e.target.files[0];
						if (!file) {
							return;
						}
						loadSwfFile(file);
					}, false);
					sa.click();
				}

				var pd_plyplaypause = document.getElementById("pd_plyplaypause");
				var pd_plysetting = document.getElementById("pd_plysetting");
				var pd_plycontrol = document.getElementById("pd_plycontrol");
				var pd_plyfullscreen = document.getElementById("pd_plyfullscreen");
				var pd_plyreload = document.getElementById("pd_plyreload");
				pd_plyplaypause.onclick = function() {
					player.toggleRunning();
				}
				pd_plysetting.onclick = function() {
					player.showSetting();
				}
				pd_plycontrol.onclick = function() {
					player.showControls();
				}
				pd_plyfullscreen.onclick = function() {
					player.fullscreen();
				}
				pd_plyreload.onclick = function() {
					player.reload();
				}

				if (isPhone) {
					pd_plyfullscreen.style.display = "";
				}

				player.menuSettingControls(false);

				pinkswf.appendChild(player.root);

				pinkfiedemo.style.background = "rgba(0, 0, 0, 0)";
				pinkfiedemo.style.width = ppwidth + "px";
				pinkfiedemo.style.height = ppheight + "px";

				player.resize(ppwidth, ppheight);

				var sle = false;

				function opendemo() {
					if (!sle) {
						pinkfiedemo.style.display = "";
						pd_pkfcontrols.style.display = "";
						sle = true;
					}
				}
				function closedemo() {
					if (sle) {
						pinkfiedemo.style.display = "none";
						pd_pkfcontrols.style.display = "none";
						sle = false;
					}
				}

				function loadSwfFile(file) {
					opendemo();
					oTitle = file.name || "";
					player.loadSwfFromFile(file);
				}

				function loadSwfUrl(url) {
					opendemo();
					player.loadSwfFromURL(url);
				}

				function dropHandler(ev) {
					ev.preventDefault();
					if (ev.dataTransfer.items) {
						var item = ev.dataTransfer.items[0];
						if (item) {
							if (item.kind === 'file') {
								var file = item.getAsFile();
								loadSwfFile(file);
							}
						}
					}
				}
				function dragOverHandler(ev) {
					ev.preventDefault();
				}

				window.ondrop = dropHandler;
				window.ondragover = dragOverHandler;

				var advancedWebGL = document.getElementById('enwebgla');

				advancedWebGL.checked = PinkFie.config.useWebGL;
				advancedWebGL.addEventListener('click', function(e) {
					PinkFie.config.useWebGL = e.target.checked;
				});

				if (Common.swfUrl) {
					loadSwfUrl(Common.swfUrl);
				}

				function loadfiletext(url, callback) {
					var xml = new XMLHttpRequest();
					xml.onload = function() {
						if (xml.status == 200) {
							callback(new Uint8Array(xml.response));	
						}
					}
					xml.responseType = "arraybuffer";
					xml.open("GET", url);
					xml.send();
				}

				var demo = document.getElementById("demo");
				demo.textContent = "Version: " + PinkFie.version + " (" + PinkFie.built + ")";

				function getDefaultDarkMode() {
					return window.matchMedia('(prefers-color-scheme: dark)').matches;
				}

				/** Dark Mode **/
				function getLocalDarkMode() {
					try {
						var value = localStorage.getItem('userPrefersDark');
						if (!value) {
						// value is undefined or null
							return getDefaultDarkMode();
						}
						// value is the string 'true' or the string 'false'
						return value === 'true';
					} catch (e) {
						console.log('error getting local color choice', e);
						return false;
					}
				}

				function setDarkMode(dark) {
					if (dark) {
						document.documentElement.classList.add('dark');
					} else {
						document.documentElement.classList.remove('dark');
					}
					try {
						return localStorage.setItem('userPrefersDark', dark);
					} catch (e) {
						console.log('error saving color choice', e);
					}
				}

				setDarkMode(getLocalDarkMode());

				function toggleDarkMode(dark) {
					setDarkMode(!document.documentElement.classList.contains('dark'));
				}
				querySelector('.theme-select a').addEventListener('click', function() {
					toggleDarkMode();
				});	
			}());
		</script>
	</body>
</html>
